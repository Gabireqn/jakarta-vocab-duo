<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jakarta Vocab Duo</title>
<meta name="theme-color" content="#13917A">

<meta name="apple-mobile-web-app-title" content="Vocab Duo">

<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: single column "commuter card" app — today's session up top, week strip, then vocabulary. Deliberately light-only, bright tropical palette. */
:root{
  --bg:#F6FAF8; --surface:#FFFFFF; --sunk:#EDF4F1; --ink:#22332E; --muted:#5F716A; --line:#DCE7E2;
  --p1:#13917A; --p1-soft:#DFF5EF; --p2:#E2553A; --p2-soft:#FDE9E3; --gold:#E0A21B; --gold-soft:#FFF4D6;
  --cta:#13917A; --cta-ink:#FFFFFF;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
#app{max-width:680px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em}
.brand span{color:var(--p2)}
.sync{font-size:.8rem;color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.pl.a{background:var(--p1-soft)} .pl.b{background:var(--p2-soft)}
.pl .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.a .nm{color:var(--p1)} .pl.b .nm{color:var(--p2)}
.pl .pts{font-family:var(--display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.pl .pts small{font-family:var(--body);font-size:.8rem;font-weight:400;color:var(--muted)}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.today{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px 20px;box-shadow:0 6px 24px -14px rgba(19,145,122,.35);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.today::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:repeating-linear-gradient(90deg,var(--p1) 0 28px,var(--p2) 28px 56px)}
.today h2{font-size:1.9rem;font-weight:800;letter-spacing:-.015em}
.today .desc{color:var(--muted)}
.plan{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.plan li{background:var(--sunk);border-radius:999px;padding:4px 12px;font-size:.85rem}
.plan li b{font-variant-numeric:tabular-nums}
.theme-line{font-size:.9rem;color:var(--muted)}
.theme-line b{color:var(--ink)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--sunk)}
.btn.primary{background:var(--cta);color:var(--cta-ink)}
.btn.primary:not(:disabled):hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.85rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.day .d{font-weight:700;font-size:.9rem}
.day .id{font-size:.65rem;color:var(--muted)}
.day .ac{font-size:.68rem;color:var(--muted);text-align:center;line-height:1.2;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.day .dot{width:8px;height:8px;border-radius:50%;background:var(--line);margin-top:2px}
.day.done .dot{background:var(--p1)}
.day.is-today{border-color:var(--p1);border-width:2px}
.day.sel{background:var(--gold-soft);border-color:var(--gold)}
.section{display:flex;flex-direction:column;gap:12px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
details.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.wk summary{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:700;list-style:none}
details.wk summary::-webkit-details-marker{display:none}
details.wk summary span{color:var(--muted);font-weight:400;font-size:.85rem;white-space:nowrap}
.wl{list-style:none;margin:0;padding:0 14px 12px;display:flex;flex-direction:column}
.wl li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.wl .en{font-weight:700}
.wl .fr{color:var(--muted);font-size:.9rem;grid-column:1}
.wl .lv{grid-row:1/3;grid-column:2;align-self:center;display:flex;gap:3px}
.lv i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.lv i.on{background:var(--p1)}
.method{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.method li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.method .k{font-family:var(--display);font-weight:800;color:var(--p2);min-width:1.4em}
.method p{color:var(--muted);font-size:.95rem}
.method b{color:var(--ink)}
/* session */
.sbar{display:flex;flex-direction:column;gap:10px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--p1)} .steps i.cur{background:var(--gold)}
.clock{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted)}
.clock.over{color:var(--p2);font-weight:700}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:300px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem}
.chip.a{background:var(--p1-soft);color:var(--p1)} .chip.b{background:var(--p2-soft);color:var(--p2)}
.prompt{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.25}
.prompt.sentence{font-family:var(--body);font-size:1.25rem;font-weight:400}
.sub{color:var(--muted)}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--gold);height:1em;vertical-align:baseline}
.note{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:.92rem}
.hint{font-size:.88rem;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:460px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;font-weight:700}
.opt:not(:disabled):hover{border-color:var(--p1)}
.opt.right{background:var(--p1-soft);border-color:var(--p1);color:var(--p1)}
.opt.wrong{background:var(--p2-soft);border-color:var(--p2);color:var(--p2)}
.opt:disabled{cursor:default}
.after{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.fb{font-weight:700}.fb.ok{color:var(--p1)}.fb.ko{color:var(--p2)}
.ex{font-style:italic}
.ex b,.lc b{font-style:normal;color:var(--p1)}
.tr{color:var(--muted)}
.answer{font-family:var(--display);font-size:1.7rem;font-weight:800;color:var(--p1)}
.timer{display:flex;align-items:center;gap:10px}
.tbar{flex:1;height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--gold);transition:width .2s linear}
.tnum{font-variant-numeric:tabular-nums;font-weight:700;min-width:3.2em;text-align:right}
.tcard{background:var(--bg);border-radius:14px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--display);font-size:2.2rem;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.lcards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lc{background:var(--bg);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.lc .en{font-family:var(--display);font-weight:700;font-size:1.15rem}
.lc .fr{color:var(--muted);font-size:.9rem}
.lc .ex{grid-column:1/-1;font-size:.95rem}
.lc .say{grid-row:1/3;grid-column:2}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.roles{grid-template-columns:1fr}}
.role{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.role.a{background:var(--p1-soft)} .role.b{background:var(--p2-soft)}
.role h4{margin:0;font-size:1rem}
.role .who{font-size:.8rem;font-weight:700}
.role.a .who{color:var(--p1)} .role.b .who{color:var(--p2)}
.tg{display:flex;flex-direction:column;gap:6px}
.tgt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:column}
.tgt small{color:var(--muted);font-weight:400}
.tgt.used{border-color:var(--p1);background:var(--p1-soft);text-decoration:line-through;text-decoration-thickness:2px}
.tgt.used small{text-decoration:none}
.score2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.missed{display:flex;flex-direction:column;gap:6px}
.missed div{background:var(--bg);border-radius:10px;padding:8px 12px}
.missed b{display:inline-block;margin-right:6px}
.confirm{background:var(--p2-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.cols{grid-template-columns:1fr}}
.foot{font-size:.8rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.tbar i{transition:none}}
.auth{max-width:520px;width:100%;margin:0 auto}
.form{display:flex;flex-direction:column;gap:8px}
.form label{font-weight:700;font-size:.9rem}
input[type=email],input[type=password]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-width:100%}
.form .btn{margin-top:6px}
.msg{border-radius:10px;padding:10px 12px;background:var(--p1-soft);color:var(--p1);font-size:.92rem}
.msg.err{background:var(--p2-soft);color:var(--p2)}
.box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.code{font-family:var(--display);font-size:1.8rem;font-weight:800;letter-spacing:.15em;color:var(--p1)}
.account{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.account b{color:var(--ink);letter-spacing:.08em}
.loading{text-align:center;color:var(--muted);padding:40px 0}
.pmeta{font-size:.82rem;color:var(--muted)}
.dots2{display:flex;gap:3px;margin-top:2px}
.dots2 i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots2 i.a.on{background:var(--p1)} .dots2 i.b.on{background:var(--p2)}
.lvs{grid-row:1/3;grid-column:2;align-self:center;display:flex;flex-direction:column;gap:4px}
.lv i.on.b{background:var(--p2)}
.chart{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:8px;border-bottom:1px solid var(--line)}
.wkcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}
.bars{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.bars i{width:40%;max-width:18px;border-radius:4px 4px 0 0;background:var(--p1);min-height:2px}
.bars i.b{background:var(--p2)}
.wklab{display:flex;gap:10px}
.wklab span{flex:1;text-align:center;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mastery{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.mbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.hard{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hard li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;gap:10px}
.hard small{color:var(--muted);white-space:nowrap}
</style>
</head>

<script>
/* ---------- Vocabulary: 8 themed weeks, 12 expressions each ---------- */

 {t:"S'installer", en:"Settling in", w:[

   {t:"Visite d'appartement à Kemang",s:"L'un visite un appartement, l'autre est le propriétaire. Négociez les détails avant de signer.",a:["Locataire",["fully furnished","utilities","security deposit"]],b:["Propriétaire",["sign a lease","move in","building manager"]]},

 {t:"Manger et faire les courses", en:"Food & shopping", w:[

 {t:"Vie sociale", en:"Small talk & friends", w:[

function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return ds(new Date());}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ds(d);}
function dow(s){const g=parse(s).getDay();return g===0?7:g;}
/* program start: the Monday of the week it began; started Thursday or later, the first theme also covers the following week */
function progStart(){return (typeof S!=="undefined"&&S&&S.start)?S.start:{d:ds(START),late:false};}
function weekNum(s){const st=progStart();return Math.max(0,Math.floor(Math.round((parse(s)-parse(st.d))/864e5)/7)-(st.late?1:0));}
function longDate(s){const d=parse(s);return DAYS[dow(s)]+" "+d.getDate()+" "+MONTHS[d.getMonth()];}

function cleanCard(x){return {box:Math.min(5,Math.max(1,+x.box||1)),due:String(x.due||""),u:+x.u||0};}
/* cards are per player: {0:{wordKey:card}, 1:{...}}. Older flat data belonged to the first player. */
function normCards(c){const out={0:{},1:{}};if(!c||typeof c!=="object")return out;
  if(Object.keys(c).some(k=>/^\d+-\d+$/.test(k))){for(const k in c)if(WMAP[k]&&c[k])out[0][k]=cleanCard(c[k]);return out;}
  [0,1].forEach(p=>{const d=c[p];if(d&&typeof d==="object")for(const k in d)if(WMAP[k]&&d[k])out[p][k]=cleanCard(d[k]);});return out;}
function norm(o){o=o||{};const b=blankState();const log={};const src=o.log&&typeof o.log==="object"?o.log:{};
  for(const d in src){if(Array.isArray(src[d]))log[d]=src[d].filter(e=>e&&typeof e==="object"&&e.id).map(e=>{const sc=Array.isArray(e.s)?[+e.s[0]||0,+e.s[1]||0]:[0,0];
    let pp=Array.isArray(e.p)?e.p.map(Number).filter(v=>v===0||v===1):[0,1].filter(i=>sc[i]>0);if(!pp.length)pp=[0,1];
    return {id:String(e.id),a:String(e.a),s:sc,p:pp,m:Array.isArray(e.m)?e.m.filter(k=>WMAP[k]).slice(0,40):[]};});}
  const members={};if(o.members&&typeof o.members==="object")for(const k in o.members){const v=+o.members[k];if(v===0||v===1)members[k]=v;}
  const tv=o.theme&&o.theme.v;const theme={v:(Number.isInteger(tv)&&tv>=0&&tv<WEEKS.length)?tv:null,u:+(o.theme&&o.theme.u)||0};
  const epoch=o.epoch&&o.epoch.id?{id:String(o.epoch.id),at:+o.epoch.at||0}:{id:"0",at:0};
  const start=o.start&&/^\d{4}-\d{2}-\d{2}$/.test(o.start.d||"")?{d:o.start.d,late:!!o.start.late}:null;
  return {names:Array.isArray(o.names)&&o.names.length===2?o.names.map(String):b.names,namesU:+o.namesU||0,members,epoch,start,theme,cards:normCards(o.cards),log};}
/* merge two states (a = server, b = this device): newest name edit wins, each card keeps its most recent review, sessions are unioned and the server copy of a session wins */
function merge(a,b){const o=blankState();
  /* after a restart, the newest restart wins entirely: older progress on any device is dropped */
  if(a.epoch.id!==b.epoch.id){const w=(b.epoch.at||0)>(a.epoch.at||0)?b:a;const r=JSON.parse(JSON.stringify(w));
    r.members=Object.assign({},b.members,a.members);if((b.namesU||0)>(r.namesU||0)){r.names=b.names;r.namesU=b.namesU;}if((a.namesU||0)>(r.namesU||0)){r.names=a.names;r.namesU=a.namesU;}return norm(r);}
  o.epoch=a.epoch;o.start=a.start||b.start;
  o.names=(b.namesU||0)>=(a.namesU||0)?b.names:a.names;o.members=Object.assign({},b.members,a.members);o.namesU=Math.max(a.namesU||0,b.namesU||0);
  o.theme=(b.theme.u||0)>=(a.theme.u||0)?b.theme:a.theme;
  [0,1].forEach(p=>{const A=a.cards[p]||{},B=b.cards[p]||{};o.cards[p]=Object.assign({},A);for(const k in B){const x=A[k],y=B[k];if(!x||(+y.u||0)>(+x.u||0))o.cards[p][k]=y;}});
  new Set(Object.keys(a.log).concat(Object.keys(b.log))).forEach(d=>{const m={};(b.log[d]||[]).concat(a.log[d]||[]).forEach(e=>m[e.id]=e);o.log[d]=Object.values(m);});
  return o;}

function save(){
  cache();

  saveChain=saveChain.then(async()=>{

      const {error}=await sb.from("couples").update({state:JSON.parse(JSON.stringify(S)),updated_at:new Date().toISOString()}).eq("id",couple.id);
      if(error)throw error;syncOk=true;}

async function pull(){
  if(!sb||!couple)return false;
  const before=JSON.stringify(S);
  try{const remote=await fetchRemote();const merged=merge(remote,S);const needPush=JSON.stringify(merged)!==JSON.stringify(merge(remote,remote));
    S=merged;cache();syncOk=true;if(needPush)save();}
  catch(e){syncOk=false;}
  showSync();
  return JSON.stringify(S)!==before;
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function themeIdx(){return S.theme.v!==null?S.theme.v:weekNum(today())%WEEKS.length;}
function themeWords(){return WORDS.filter(x=>x.w===themeIdx());}
function introduced(){const m={};(sess?slots():[0,1]).forEach(p=>seenWords(p).forEach(w=>m[w.k]=w));return Object.values(m);}
function olderWords(){return introduced().filter(x=>x.w!==themeIdx());}
function pool(){const p=introduced();const t=themeWords();const m={};p.concat(t).forEach(x=>m[x.k]=x);return Object.values(m);}
function opts(ans,all){return shuffle([ans].concat(shuffle([...new Set(all)].filter(x=>x!==ans)).slice(0,3)));}
function blank(ex){return esc(ex).replace("___",'<span class="blank" aria-label="blanc"></span>');}
function hl(w){return esc(w.ex).replace("___","<b>"+esc(w.en)+"</b>");}
function name(p){return esc(S.names[p]||("Joueur "+(p+1)));}
function chip(p,txt){return `<span class="chip ${p?"b":"a"}">${txt||("À toi, "+name(p))}</span>`;}
const canSay=typeof window.speechSynthesis!=="undefined";
function sayBtn(t,cls){return canSay?`<button class="btn ghost small say ${cls||""}" data-say="${esc(t)}">Écouter</button>`:"";}
function wireSay(el){el.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(b.dataset.say);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u);}catch(e){}});}
function dueCount(p){return dueFor(p,today()).length;}
function normAns(x){return String(x).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:"«»()]/g,"").replace(/\s+/g," ").trim();}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[n];}
/* 2 = exact, 1 = small typo accepted, 0 = wrong */
function checkTyped(input,ans){const a=normAns(input),b=normAns(ans);const st=x=>x.replace(/^(a|an|the) /,"");
  if(a===b||st(a)===st(b))return 2;const d=lev(st(a),st(b));if((b.length>=6&&d<=1)||(b.length>=12&&d<=2))return 1;return 0;}

/* ---------- session engine ---------- */
let sess=null;
function point(p){sess.scores[p]++;}
function stopTimers(){if(sess){sess.timers.forEach(clearInterval);sess.timers=[];}}
function startSession(id,solo){
  sess={id,solo:(solo===0||solo===1)?solo:null,step:0,scores:[0,0],turn:Math.random()<.5?0:1,start:Date.now(),timers:[],updates:{},missed:[],clock:null};
  sess.steps=buildSteps(id);
  renderSession();
  sess.clock=setInterval(tickClock,1000);
}
function tickClock(){const el=$("#clk");if(!el||!sess)return;const s=Math.floor((Date.now()-sess.start)/1000);el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")+" / 15:00";el.classList.toggle("over",s>900);}
function renderSession(){
  stopTimers();
  const st=sess.steps[sess.step];
  $("#app").innerHTML=`<div class="sbar"><div class="shead"><span class="eyebrow">${esc(actName(sess.id))} · ${esc(st.title)}</span><span class="clock" id="clk"></span></div>
    <div class="steps">${sess.steps.map((s,i)=>`<i class="${i<sess.step?"on":i===sess.step?"cur":""}"></i>`).join("")}</div>
    <div class="row" style="justify-content:space-between"><div class="row">${slots().map(p=>chip(p,name(p)+" · "+sess.scores[p])).join("")}</div><button class="btn ghost small" id="quit">Quitter</button></div>
    <div id="qc"></div></div>
  <div class="stage" id="stage"></div>`;
  tickClock();
  $("#quit").onclick=()=>{$("#qc").innerHTML=`<div class="confirm"><p>Quitter la séance ? Vos révisions déjà faites seront gardées, mais la séance ne comptera pas comme terminée.</p><div class="row"><button class="btn primary small" id="qy">Quitter</button><button class="btn ghost small" id="qn">Continuer la séance</button></div></div>`;
    $("#qy").onclick=()=>finish(false);$("#qn").onclick=()=>{$("#qc").innerHTML="";};};
  const stage=$("#stage");
  st.run(stage,()=>{sess.step++;renderSession();});
  wireSay(stage);
  window.scrollTo({top:0});
}
function refreshScores(){const c=document.querySelectorAll(".sbar .chip");slots().forEach((p,i)=>{if(c[i])c[i].textContent=S.names[p]+" · "+sess.scores[p];});}
function finish(complete){
  stopTimers();clearInterval(sess.clock);
  const now=Date.now();
  for(const key in sess.updates){const [p,k]=key.split("|");deck(+p)[k]=Object.assign({},sess.updates[key],{u:now});}
  if(complete){
    const tom=addDays(today(),1);
    if(sess.id!=="difficiles")slots().forEach(p=>themeWords().forEach(w=>{if(!deck(p)[w.k])deck(p)[w.k]={box:1,due:tom,u:0};}));
    const t=today();S.log[t]=dayLog(t).concat({id:now.toString(36)+Math.random().toString(36).slice(2,7),a:sess.id,s:sess.scores.slice(),p:slots(),m:uniq(sess.missed).map(w=>w.k).slice(0,40)});
  }
  if(complete||Object.keys(sess.updates).length)save().then(()=>{if(!sess)renderHome();});
  sess=null;selDay=dow(today());renderHome();window.scrollTo({top:0});
}

/* generic multiple-choice step */
function quizStep(title,mins,makeItems,intro,noMiss){
  return {title,mins,run(el,next){
    const items=makeItems();let i=0;
    const show=()=>{
      if(i>=items.length)return next();
      const it=items[i],p=who(sess.turn);
      el.innerHTML=`${intro&&i===0?`<p class="note">${intro}</p>`:""}<div class="qhead">${chip(p)}<span class="count">${i+1}/${items.length}</span></div>
        <div class="prompt ${it.sentence?"sentence":""}">${it.prompt}</div>${it.sub?`<p class="sub">${it.sub}</p>`:""}
        <div class="opts">${it.options.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div><div class="after" hidden></div>`;
      el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        const ok=it.options[+b.dataset.j]===it.answer;
        el.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(it.options[+x.dataset.j]===it.answer)x.classList.add("right");});
        if(ok)point(p);else{b.classList.add("wrong");if(!noMiss)sess.missed.push(it.word);}
        refreshScores();
        const a=el.querySelector(".after");a.hidden=false;
        a.innerHTML=`<p class="fb ${ok?"ok":"ko"}">${ok?"Bien joué !":"Pas cette fois."}</p>${it.after||""}<div class="row end">${sayBtn(it.word.en)}<button class="btn primary" id="nx">Suivant</button></div>`;
        wireSay(a);const nx=a.querySelector("#nx");nx.onclick=()=>{i++;sess.turn++;show();};nx.focus();
      });
    };show();
  }};
}
function frToEn(w,all){return {word:w,prompt:esc(w.fr),sub:blank(w.ex),answer:w.en,options:opts(w.en,all),after:`<p class="ex">${hl(w)}</p>`};}
function gapItem(w,all){return {word:w,sentence:true,prompt:blank(w.ex),sub:"Quelle expression complète la phrase ?",answer:w.en,options:opts(w.en,all),after:`<p class="ex">${hl(w)}</p><p class="tr">${esc(w.fr)}</p>`};}

/* spaced review: each player reviews their own deck; in a duo session turns alternate */
function reviewStep(max,mins,title){
  return {title:title||"Révision espacée",mins,run(el,next){
    const t=today(),ps=slots(),per=Math.ceil(max/ps.length);
    const lists=ps.map(p=>dueFor(p,t).slice(0,per).map(([k])=>({w:WMAP[k],p})));
    const first=who(sess.turn),order=ps.length===2?[first,1-first]:ps;
    const seq=[];while(lists.some(l=>l.length))order.forEach(p=>{const l=lists[ps.indexOf(p)];if(l.length)seq.push(l.shift());});
    if(!seq.length){
      const any=ps.some(p=>Object.keys(deck(p)).length);
      el.innerHTML=`<h3>Rien à réviser aujourd'hui</h3><p class="sub">${any?"Toutes les expressions sont à jour. Elles reviendront au bon moment.":"Les premières révisions arriveront demain, après la séance d'aujourd'hui."}</p><div class="row end"><button class="btn primary" id="nx">Continuer</button></div>`;
      $("#nx").onclick=next;return;
    }
    let i=0;
    const show=()=>{
      if(i>=seq.length)return next();
      const {w,p}=seq[i],c=deck(p)[w.k];
      el.innerHTML=`${i===0?`<p class="note">Dis l'expression anglaise à voix haute avant de retourner la carte. Sois honnête : une carte ratée revient demain, une carte sue revient plus tard.</p>`:""}
        <div class="qhead">${chip(p)}<span class="count">${i+1}/${seq.length} · niveau ${c.box}</span></div>
        <div class="prompt">${esc(w.fr)}</div><p class="sub">${blank(w.ex)}</p>
        <div class="row end"><button class="btn primary" id="rv">Voir la réponse</button></div><div class="after" hidden></div>`;
      const rv=$("#rv");rv.focus();
      rv.onclick=()=>{rv.hidden=true;const a=el.querySelector(".after");a.hidden=false;
        a.innerHTML=`<div class="answer">${esc(w.en)}</div><p class="ex">${hl(w)}</p><div class="row end">${sayBtn(w.en)}<button class="btn ghost" id="ko">Pas encore</button><button class="btn primary" id="ok">Je savais</button></div>`;
        wireSay(a);
        const grade=ok=>{const nb=ok?Math.min(5,c.box+1):1;sess.updates[p+"|"+w.k]={box:nb,due:addDays(t,ok?IV[nb]:1)};if(ok)point(p);else sess.missed.push(w);refreshScores();i++;sess.turn++;show();};
        $("#ok").onclick=()=>grade(true);$("#ko").onclick=()=>grade(false);};
    };show();
  }};
}

/* typed recall: produce the expression, not just recognise it */
function typeStep(title,mins,getWords,intro){
  return {title,mins,run(el,next){
    const ws=getWords();let i=0;
    if(!ws.length)return next();
    const show=()=>{
      if(i>=ws.length)return next();
      const w=ws[i],p=who(sess.turn);
      el.innerHTML=`${intro&&i===0?`<p class="note">${intro}</p>`:""}<div class="qhead">${chip(p)}<span class="count">${i+1}/${ws.length}</span></div>
        <div class="prompt">${esc(w.fr)}</div><p class="sub">${blank(w.ex)}</p>
        <form id="tf" class="form" autocomplete="off"><label for="ta">Écris l'expression en anglais</label><input type="text" id="ta" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
        <div class="row end"><button class="btn ghost" type="button" id="tk">Je ne sais pas</button><button class="btn primary" type="submit">Valider</button></div></form>
        <div class="after" hidden></div>`;
      const inp=$("#ta");inp.focus();
      const done=r=>{$("#tf").hidden=true;if(r>0)point(p);else sess.missed.push(w);refreshScores();
        const a=el.querySelector(".after");a.hidden=false;
        a.innerHTML=`<p class="fb ${r?"ok":"ko"}">${r===2?"Exact !":r===1?"Presque, attention à l'orthographe :":"La bonne réponse :"}</p><div class="answer">${esc(w.en)}</div>${r<2&&inp.value.trim()?`<p class="hint">Tu as écrit : ${esc(inp.value.trim())}</p>`:""}<p class="ex">${hl(w)}</p><div class="row end">${sayBtn(w.en)}<button class="btn primary" id="nx">Suivant</button></div>`;
        wireSay(a);const nx=a.querySelector("#nx");nx.onclick=()=>{i++;sess.turn++;show();};nx.focus();};
      $("#tf").onsubmit=e=>{e.preventDefault();if(!inp.value.trim())return;done(checkTyped(inp.value,w.en));};
      $("#tk").onclick=()=>done(0);
    };show();
  }};
}

function countdown(el,secs,onEnd){
  const bar=el.querySelector(".tbar i"),num=el.querySelector(".tnum"),end=Date.now()+secs*1000;
  const tick=()=>{const left=Math.max(0,end-Date.now());num.textContent=Math.ceil(left/1000)+" s";bar.style.width=(left/(secs*1000)*100)+"%";if(left<=0){stopTimers();onEnd();}};
  tick();sess.timers.push(setInterval(tick,200));
}

/* Monday: learn list */
function learnStep(){
  return {title:"Découverte",mins:6,run(el,next){
    const ws=themeWords();
    el.innerHTML=`<p class="note">Lisez chaque exemple à voix haute, à tour de rôle. Pour 3 expressions qui vous parlent, inventez une phrase sur votre future vie à Jakarta.</p>
      <h3>${esc(WEEKS[themeIdx()].t)} · ${esc(WEEKS[themeIdx()].en)}</h3>
      <ul class="lcards">${ws.map(w=>`<li class="lc"><span class="en">${esc(w.en)}</span><span class="fr">${esc(w.fr)}</span>${sayBtn(w.ex.replace("___",w.en))}<span class="ex">${hl(w)}</span></li>`).join("")}</ul>
      <div class="row end"><button class="btn primary" id="nx">On passe au rappel</button></div>`;
    $("#nx").onclick=next;
  }};
}

/* Tuesday: taboo */
function tabooStep(){
  return {title:"Taboo",mins:8,run(el,next){
    const deck=shuffle(themeWords().concat(shuffle(olderWords()).slice(0,8)));let di=0,round=0;const SOLO=sess.solo!==null,R=SOLO?2:4,SECS=90;
    const intro=()=>{
      if(round>=R)return next();
      const d=who(sess.turn+round),g=who(sess.turn+round+1);
      if(SOLO){el.innerHTML=`<p class="eyebrow">Manche ${round+1} sur ${R}</p><h3>Explique à voix haute, ${name(d)}</h3>
        <p>Décris chaque expression en anglais, à voix haute, comme si quelqu'un devait la deviner. Interdit : la dire ou la traduire. Valide quand ta description tient en deux phrases claires.</p>
        <p class="note">Astuce : « It's what you say when… », « It's the opposite of… », « You do it when… ».</p>
        <div class="row end"><button class="btn primary" id="gob">Lancer les ${SECS} secondes</button></div>`;$("#gob").onclick=()=>play(d,d);return;}
      el.innerHTML=`<p class="eyebrow">Manche ${round+1} sur ${R}</p><h3>${name(d)} fait deviner, ${name(g)} devine</h3>
        <p>Décris l'expression en anglais. Interdit : la dire, la traduire en français, la mimer. Un point pour ${name(g)} à chaque expression trouvée.</p>
        <p class="note">${name(g)}, ne regarde pas l'écran. Astuce : « It's what you say when… », « It's the opposite of… », « You do it when… ».</p>
        <div class="row end"><button class="btn primary" id="gob">Lancer les ${SECS} secondes</button></div>`;
      $("#gob").onclick=()=>play(d,g);
    };
    const play=(d,g)=>{
      let found=0;
      el.innerHTML=`<div class="timer"><div class="tbar"><i></i></div><span class="tnum"></span></div><div class="tcard" id="tc"></div><div class="row end"><button class="btn ghost" id="ps">Passer</button><button class="btn primary" id="okb">${d===g&&sess.solo!==null?"Expliqué":"Trouvé"}</button></div>`;
      const card=()=>{const w=deck[di%deck.length];$("#tc").innerHTML=`<div class="big">${esc(w.en)}</div><div class="sub">${esc(w.fr)}</div><p class="ex">${hl(w)}</p>`;};
      card();
      $("#okb").onclick=()=>{found++;point(g);refreshScores();di++;card();};
      $("#ps").onclick=()=>{sess.missed.push(deck[di%deck.length]);di++;card();};
      countdown(el,SECS,()=>{
        el.innerHTML=`<h3>Temps écoulé</h3><p class="answer">${found} expression${found>1?"s":""} ${sess.solo!==null?"expliquée":"trouvée"}${found>1?"s":""}</p><div class="row end"><button class="btn primary" id="nr">${round+1<R?"Manche suivante":"Continuer"}</button></div>`;
        $("#nr").onclick=()=>{round++;intro();};
      });
    };
    intro();
  }};
}

/* Wednesday: speaking prompt */
function oralStep(){
  return {title:"À l'oral",mins:4,run(el,next){
    const ws=shuffle(themeWords()),SOLO=sess.solo!==null,sets=SOLO?{[sess.solo]:ws.slice(0,6)}:[ws.slice(0,3),ws.slice(3,6)];const used=[[],[]];
    el.innerHTML=`<p class="note">${SOLO?"Dis à voix haute une phrase par expression sur ta future vie à Jakarta, puis coche-la.":"Chacun dit une phrase par expression, sur votre future vie à Jakarta. L'autre écoute et coche si l'expression est bien utilisée."}</p>
      <div class="roles">${slots().map(p=>`<div class="role ${p?"b":"a"}"><span class="who">${name(p)}</span><div class="tg">${sets[p].map((w,j)=>`<button class="tgt" data-p="${p}" data-j="${j}" aria-pressed="false">${esc(w.en)}<small>${esc(w.fr)}</small></button>`).join("")}</div></div>`).join("")}</div>
      <div class="row end"><button class="btn primary" id="nx">Terminer</button></div>`;
    el.querySelectorAll(".tgt").forEach(b=>b.onclick=()=>{const p=+b.dataset.p,j=+b.dataset.j;const on=!used[p][j];used[p][j]=on;b.classList.toggle("used",on);b.setAttribute("aria-pressed",on);sess.scores[p]+=on?1:-1;refreshScores();});
    $("#nx").onclick=next;
  }};
}

/* Thursday: role-play */
function roleStep(idx){
  return {title:"Scène "+(idx+1),mins:5,run(el,next){
    const rp=WEEKS[themeIdx()].role[idx];const pa=who(sess.turn+idx),pb=who(sess.turn+idx+1);
    const find=en=>WORDS.find(x=>x.en===en)||{en,fr:""};
    el.innerHTML=`<p class="eyebrow">Jeu de rôle · 4 minutes</p><h3>${esc(rp.t)}</h3><p>${esc(rp.s)}</p>
      <div class="timer"><div class="tbar"><i></i></div><span class="tnum"></span></div>
      <div class="roles">${[[rp.a,pa,"a"],[rp.b,pb,"b"]].map(([r,p,c])=>`<div class="role ${p?"b":"a"}"><span class="who">${name(p)}</span><h4>${esc(r[0])}</h4><div class="tg">${r[1].map((en,j)=>{const w=find(en);return `<button class="tgt" data-p="${p}" aria-pressed="false">${esc(w.en)}<small>${esc(w.fr)}</small></button>`;}).join("")}</div></div>`).join("")}</div>
      <p class="hint">${sess.solo!==null?"Joue les deux rôles à voix haute, en changeant de voix. Touche une expression dès que tu l'as utilisée.":"Touchez une expression dès qu'elle est utilisée. Parlez uniquement en anglais."}</p>
      <div class="row end"><button class="btn primary" id="nx">${idx===0?"Scène suivante":"Terminer"}</button></div>`;
    el.querySelectorAll(".tgt").forEach(b=>b.onclick=()=>{const p=+b.dataset.p;const on=!b.classList.contains("used");b.classList.toggle("used",on);b.setAttribute("aria-pressed",on);sess.scores[p]+=on?1:-1;refreshScores();});
    countdown(el,240,()=>{el.querySelector(".tnum").textContent="Fin";});
    $("#nx").onclick=next;
  }};
}

/* Friday: duel */
function duelStep(){
  return {title:"Duel express",mins:6,run(el,next){
    const P=pool(),all=P.map(x=>x.en);let round=0;const SOLO=sess.solo!==null,R=SOLO?2:4,SECS=45;const res=[0,0];
    const intro=()=>{
      if(round>=R){el.innerHTML=SOLO?`<h3>Résultat</h3><p class="answer">${name(sess.solo)} : ${res[sess.solo]} bonne${res[sess.solo]>1?"s":""} réponse${res[sess.solo]>1?"s":""} en ${R} manches</p><p class="hint">Le prochain duel à deux, essaie de battre ce score.</p><div class="row end"><button class="btn primary" id="nx">Continuer</button></div>`:`<h3>Résultat du duel</h3><div class="score2">${[0,1].map(p=>`<div class="pl ${p?"b":"a"}"><span class="nm">${name(p)}</span><span class="pts">${res[p]}</span></div>`).join("")}</div><p class="answer">${res[0]===res[1]?"Égalité !":(res[0]>res[1]?name(0):name(1))+" gagne le duel"}</p><div class="row end"><button class="btn primary" id="nx">Continuer</button></div>`;$("#nx").onclick=next;return;}
      const p=who(sess.turn+round);
      el.innerHTML=`<p class="eyebrow">Manche ${round+1} sur ${R}</p><h3>${SOLO?"À toi, "+name(p):"Passe le téléphone à "+name(p)}</h3><p>Traduis un maximum d'expressions en ${SECS} secondes. Une erreur ne coûte rien, sauf du temps.</p><div class="row end"><button class="btn primary" id="gob">C'est parti</button></div>`;
      $("#gob").onclick=()=>play(p);
    };
    const play=p=>{
      let q=shuffle(P),qi=0,lock=false;const myRound=round;
      el.innerHTML=`<div class="timer"><div class="tbar"><i></i></div><span class="tnum"></span></div><div class="qhead">${chip(p,name(p))}<span class="count" id="dc">0</span></div><div class="prompt" id="dp"></div><div class="opts" id="do"></div>`;
      const ask=()=>{const w=q[qi%q.length];const o=opts(w.en,all);$("#dp").textContent=w.fr;
        $("#do").innerHTML=o.map((x,j)=>`<button class="opt" data-j="${j}">${esc(x)}</button>`).join("");lock=false;
        $("#do").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const ok=o[+b.dataset.j]===w.en;
          $("#do").querySelectorAll(".opt").forEach(x=>{if(o[+x.dataset.j]===w.en)x.classList.add("right");});
          if(ok){res[p]++;point(p);refreshScores();$("#dc").textContent=res[p];}else{b.classList.add("wrong");sess.missed.push(w);}
          setTimeout(()=>{if(round!==myRound||!document.getElementById("do"))return;qi++;ask();},ok?350:900);});};
      ask();
      countdown(el,SECS,()=>{round++;el.innerHTML=`<h3>Stop !</h3><p class="answer">${name(p)} : ${res[p]} point${res[p]>1?"s":""}</p><div class="row end"><button class="btn primary" id="nr">Suite</button></div>`;$("#nr").onclick=intro;});
    };
    intro();
  }};
}
function missedStep(){
  return {title:"Erreurs à revoir",mins:2,run(el,next){
    const m=uniq(sess.missed);
    el.innerHTML=m.length?`<h3>Les expressions qui ont résisté</h3><p class="note">${sess.solo!==null?"Relis-les à voix haute.":"Relisez-les à voix haute, chacun votre tour."} Elles reviendront dans vos révisions.</p><div class="missed">${m.map(w=>`<div><b>${esc(w.en)}</b>${esc(w.fr)}<p class="ex">${hl(w)}</p></div>`).join("")}</div><div class="row end"><button class="btn primary" id="nx">Continuer</button></div>`
      :`<h3>Aucune erreur</h3><p class="sub">Duel parfait.</p><div class="row end"><button class="btn primary" id="nx">Continuer</button></div>`;
    $("#nx").onclick=next;
  }};
}
function uniq(a){const m={};a.forEach(w=>{if(w)m[w.k]=w;});return Object.values(m);}

/* Saturday: story */
function storyStep(){
  return {title:"Histoire à deux",mins:10,run(el,next){
    const start=STORIES[Math.floor(Math.random()*STORIES.length)];const P=shuffle(pool());let pi=0,turn=0;const T=10;
    const show=()=>{
      if(turn>=T){el.innerHTML=`<h3>Fin de l'histoire</h3><p>${sess.solo!==null?"Pour finir, raconte-la en entier en une minute, sans regarder l'écran.":"Pour finir, racontez-la en entier en 30 secondes chacun, sans regarder l'écran."}</p><div class="row end"><button class="btn primary" id="nx">Terminer</button></div>`;$("#nx").onclick=next;return;}
      const p=who(sess.turn+turn),w=P[pi%P.length];let swapped=false;
      el.innerHTML=`${turn===0?`<p class="note">Début de l'histoire, à lire à voix haute : « ${esc(start)} »</p>`:""}
        <div class="qhead">${chip(p)}<span class="count">Tour ${turn+1}/${T}</span></div>
        <p class="sub">Ajoute une ou deux phrases à l'histoire en utilisant :</p>
        <div class="tcard"><div class="big" id="sw">${esc(w.en)}</div><div class="sub" id="sf">${esc(w.fr)}</div></div>
        <div class="row end"><button class="btn ghost" id="sk">Autre mot (1 fois)</button><button class="btn ghost" id="no">Raté</button><button class="btn primary" id="ok">Utilisé</button></div>`;
      $("#sk").onclick=()=>{if(swapped)return;swapped=true;pi++;const x=P[pi%P.length];$("#sw").textContent=x.en;$("#sf").textContent=x.fr;$("#sk").disabled=true;};
      $("#ok").onclick=()=>{point(p);refreshScores();pi++;turn++;show();};
      $("#no").onclick=()=>{sess.missed.push(P[pi%P.length]);pi++;turn++;show();};
    };show();
  }};
}

/* Sunday recap */
function recapStep(){
  return {title:"Récap",mins:2,run(el,next){
    const t=today(),mon=addDays(t,-(dow(t)-1));
    const days=[1,2,3,4,5,6,7].map(d=>{const dd=addDays(mon,d-1);return {d,done:dayLog(dd).length>0||dd===t};});
    const n=days.filter(x=>x.done).length;
    el.innerHTML=`<h3>Votre semaine</h3><p class="answer">${n} séance${n>1?"s":""} sur 7</p><p class="hint">Aujourd'hui est compté, puisque vous êtes en train de finir le bilan.</p>
      <div class="week">${days.map(x=>`<div class="day ${x.done?"done":""}"><span class="d">${DAYS[x.d].slice(0,3)}</span><span class="dot"></span></div>`).join("")}</div>
      <p>Expressions vues depuis le début : <b>${introduced().length}</b> sur ${WORDS.length}. Thème de la semaine prochaine : <b>${esc(WEEKS[(weekNum(t)+1)%WEEKS.length].t)}</b>.</p>
      <p class="note">Défi de la semaine prochaine : placez chacun trois expressions de cette semaine dans une vraie conversation (au travail, avec des amis, ou en vous écrivant en anglais).</p>
      <div class="row end"><button class="btn primary" id="nx">Continuer</button></div>`;
    $("#nx").onclick=next;
  }};
}

function endStep(){
  return {title:"Fin",mins:0,run(el){
    const m=uniq(sess.missed),a=sess.scores[0],b=sess.scores[1];
    el.innerHTML=`<p class="eyebrow">Séance terminée</p><h3>${sess.solo!==null?"Bravo "+name(sess.solo):a===b?"Égalité parfaite":(a>b?name(0):name(1))+" remporte la séance"}</h3>
      <div class="score2">${slots().map(p=>`<div class="pl ${p?"b":"a"}"><span class="nm">${name(p)}</span><span class="pts">+${sess.scores[p]}</span></div>`).join("")}</div>
      ${m.length?`<p class="sub">À retravailler : ${m.slice(0,8).map(w=>`<b>${esc(w.en)}</b>`).join(", ")}${m.length>8?"…":""}</p>`:""}
      ${sess.id!=="difficiles"&&themeWords().some(w=>slots().some(p=>!deck(p)[w.k]))?`<p class="hint">Les expressions du thème « ${esc(WEEKS[themeIdx()].t)} » rejoignent vos révisions à partir de demain.</p>`:""}
      <div class="row end"><button class="btn primary" id="fin">Enregistrer et terminer</button></div>`;
    $("#fin").onclick=()=>finish(true);
  }};
}

function buildSteps(id){
  const all=()=>themeWords().map(x=>x.en);
  switch(id){
    case "difficiles":{const hw=hardest(sess.solo,8).map(h=>h.w);const en=WORDS.map(x=>x.en);return [
      typeStep("À l'écrit",3,()=>shuffle(hw),"Les expressions qui vous ont posé problème. Écris-les de mémoire."),
      quizStep("En contexte",2,()=>shuffle(hw).map(w=>gapItem(w,en)),"Même expressions, dans leur phrase."),
      endStep()];}
    case "decouverte":return [reviewStep(10,3),
      quizStep("Prétest",3,()=>shuffle(themeWords()).map(w=>({word:w,prompt:esc(w.en),sub:"Que veut dire cette expression ? Devinez !",answer:w.fr,options:opts(w.fr,themeWords().map(x=>x.fr)),after:`<p class="ex">${hl(w)}</p>`})),"Devinez le sens avant d'apprendre. Se tromper ici n'a aucune importance : chercher la réponse prépare la mémoire.",true),
      learnStep(),
      quizStep("Rappel",3,()=>shuffle(themeWords()).map(w=>frToEn(w,all())),"Maintenant, dans l'autre sens : retrouvez l'expression anglaise."),
      endStep()];
    case "taboo":return [reviewStep(10,3),tabooStep(),endStep()];
    case "trous":{const order=shuffle(themeWords());return [reviewStep(10,3),
      quizStep("Phrases à trous",4,()=>order.slice(0,8).map(w=>gapItem(w,all())),"Lis la phrase à voix haute en remplaçant le blanc, puis choisis."),
      typeStep("À l'écrit",4,()=>order.slice(8,12).concat(shuffle(order.slice(0,8)).slice(0,2)),"Maintenant sans options : écris l'expression de mémoire. Chercher la réponse soi-même la fixe beaucoup mieux que la reconnaître."),
      oralStep(),endStep()];}
    case "role":return [reviewStep(10,3),roleStep(0),roleStep(1),endStep()];
    case "duel":return [reviewStep(10,3),duelStep(),missedStep(),endStep()];
    case "histoire":return [reviewStep(10,3),storyStep(),endStep()];
    case "bilan":return [reviewStep(24,6,"Grande révision"),
      quizStep("Quiz mélangé",4,()=>{const P=pool(),en=P.map(x=>x.en);return shuffle(P).slice(0,8).map((w,i)=>i%2?gapItem(w,en):frToEn(w,en));},"Ce quiz mélange toutes les semaines déjà vues : alterner les thèmes aide à mieux distinguer les expressions."),
      typeStep("À l'écrit",3,()=>shuffle(pool()).slice(0,5),"Pour finir, écris quelques expressions de mémoire."),
      recapStep(),endStep()];
  }
}

/* ---------- boot ---------- */
(function boot(){
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(!sb){
    if(libMissing){let last=null;try{last=JSON.parse(localStorage.getItem("jvd-last-couple"));}catch(e){}
      if(last&&last.id){couple=last;KEY="jvd-c-"+couple.id;loadCache();}}
    renderHome();return;}
  let first=true;
  sb.auth.onAuthStateChange((ev,session)=>{
    const u=session&&session.user||null;
    if(ev==="PASSWORD_RECOVERY"){user=u;setTimeout(()=>renderNewPassword(),0);return;}
    const changed=(u?u.id:null)!==(user?user.id:null);
    user=u;
    if(first||changed){first=false;if(changed)couple=null;setTimeout(route,0);}
  });
  const refresh=async()=>{if(document.visibilityState==="visible"&&!sess&&couple){if(await pull()&&!sess&&!editNames)renderHome();}};
  document.addEventListener("visibilitychange",refresh);
  window.addEventListener("online",refresh);
  setInterval(refresh,60000);
})();
</script>
